name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # bindgen (whisper.cpp bindings for voice typing) needs libclang;
  # the Windows runner ships LLVM here.
  LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

jobs:
  check:
    name: Build, test, clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Tests that need a GPU, SteamVR or a live desktop are #[ignore]d.
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Steam build compiles the update notifier out.
      - name: Clippy (Steam build)
        run: cargo clippy -p rsoverlay-app --features steam --locked -- -D warnings

  deny:
    name: cargo-deny (licences, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
