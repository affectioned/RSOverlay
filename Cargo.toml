[workspace]
resolver = "2"
members = [
    "crates/rsoverlay-core",
    "crates/rsoverlay-openvr",
    "crates/rsoverlay-capture",
    "crates/rsoverlay-notify",
    "crates/rsoverlay-render",
    "crates/rsoverlay-input",
    "crates/rsoverlay-ui",
    "crates/rsoverlay-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aigoatsamuel/rsoverlay"
authors = ["RSOverlay Contributors"]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
bytemuck = { version = "1.14", features = ["derive"] }
glam = { version = "0.25", features = ["bytemuck"] }

# Async
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Render
wgpu = "0.19"
pollster = "0.3"
raw-window-handle = "0.6"
egui = "0.26"
egui-wgpu = "0.26"
egui-winit = "0.26"

# Windows
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

# Internal crates
rsoverlay-core    = { path = "crates/rsoverlay-core" }
rsoverlay-openvr  = { path = "crates/rsoverlay-openvr" }
rsoverlay-capture = { path = "crates/rsoverlay-capture" }
rsoverlay-notify = { path = "crates/rsoverlay-notify" }
rsoverlay-render = { path = "crates/rsoverlay-render" }
rsoverlay-input  = { path = "crates/rsoverlay-input" }
rsoverlay-ui     = { path = "crates/rsoverlay-ui" }
rsoverlay-app    = { path = "crates/rsoverlay-app" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
