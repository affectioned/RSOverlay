    <line x1="9.8"  y1="9.8"  x2="14.7" y2="14.7"/>
    <line x1="33.3" y1="33.3" x2="38.2" y2="38.2"/>
    <line x1="9.8"  y1="38.2" x2="14.7" y2="33.3"/>
    <line x1="33.3" y1="14.7" x2="38.2" y2="9.8"/>
