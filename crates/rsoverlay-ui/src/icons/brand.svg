<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer ring, thicker so it survives rasterization at small sizes -->
  <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="4"/>
  <!-- 'R' glyph: stem, bowl, leg — hand-tuned, stroke-thick enough to read at 16px -->
  <path d="M20 46V18h12a8 8 0 0 1 4.8 14.4L44 46"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center dot, kept as a filled circle for sharp low-res rendering -->
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
</svg>
