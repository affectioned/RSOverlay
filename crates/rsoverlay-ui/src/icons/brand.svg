        stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>
  <rect x="15" y="17" width="28" height="22" rx="6"
        stroke="#FFFFFF" stroke-width="3" fill="#FFFFFF" fill-opacity="0.14"/>
  <circle cx="35.5" cy="24.5" r="2.6" fill="#FFFFFF"/>
</svg>
