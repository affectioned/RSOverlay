[package]
name = "rsoverlay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rsoverlay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
pollster.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
raw-window-handle.workspace = true
rsoverlay-core.workspace = true
rsoverlay-render.workspace = true
rsoverlay-notify.workspace = true
rsoverlay-ui.workspace = true
rsoverlay-capture.workspace = true
rsoverlay-input.workspace = true
rsoverlay-osc.workspace = true
egui.workspace = true
egui-winit.workspace = true
clap = { version = "4.5", features = ["derive"] }
winit = { version = "0.29", features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
rsoverlay-openvr.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
