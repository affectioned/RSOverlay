# cargo-deny config. Run: cargo deny check
[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # webbrowser < 1.0: BROWSER env-var argument injection in its Unix
    # backend only. RSOverlay is Windows-only, and egui-winit 0.26 pins
    # ^0.8. Drop this when egui is upgraded.
    { id = "RUSTSEC-2026-0257", reason = "Unix-only code path; RSOverlay ships on Windows; pinned by egui-winit 0.26" },
    # chrono marked unmaintained with no successor release yet. Used for
    # clock / date formatting only. Migration target: `jiff`.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no fix available; local clock formatting only; migrate to jiff" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
]
exceptions = [
    # egui's bundled fonts: Ubuntu-Light (Ubuntu Font Licence) and
    # Noto / emoji fonts (OFL).
    { allow = ["OFL-1.1", "LicenseRef-UFL-1.0"], crate = "epaint" },
    # Voice typing: whisper.cpp's Rust bindings (public-domain Unlicense).
    { allow = ["Unlicense"], crate = "whisper-rs" },
    { allow = ["Unlicense"], crate = "whisper-rs-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies (workspace is publish = false).
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
